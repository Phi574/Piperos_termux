name: Build bootstrap archives

on:
  workflow_dispatch:
    inputs:
      android_abi:
        description: Architecture to build
        required: true
        default: all
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86_64
  push:
    tags:
      - "runtime-v*"
      - "bootstrap-test-x86-*"

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/bootstrap-test-x86-') }}

jobs:
  build:
    name: Build ${{ matrix.android_abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        android_abi: ${{ fromJSON(startsWith(github.ref, 'refs/tags/bootstrap-test-x86-') && '["x86_64"]' || inputs.android_abi == 'arm64-v8a' && '["arm64-v8a"]' || inputs.android_abi == 'armeabi-v7a' && '["armeabi-v7a"]' || inputs.android_abi == 'x86_64' && '["x86_64"]' || '["arm64-v8a","armeabi-v7a","x86_64"]') }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          df -h

      - name: Build bootstrap from source
        run: |
          ./scripts/run-with-progress.sh \
            "dist/logs/bootstrap-${{ matrix.android_abi }}.log" \
            ./scripts/build-bootstrap.sh \
            "${{ matrix.android_abi }}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piperos-bootstrap-log-${{ matrix.android_abi }}
          path: dist/logs
          if-no-files-found: warn
          retention-days: 14

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: piperos-bootstrap-${{ matrix.android_abi }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/runtime-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SIGNING_KEY_B64: ${{ secrets.PIPEROS_MANIFEST_SIGNING_KEY_B64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: piperos-bootstrap-*
          merge-multiple: true
          path: dist

      - name: Generate and verify manifest
        env:
          RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          ./scripts/generate-manifest.py \
            --input dist \
            --output dist/runtime-manifest.json \
            --base-url "$RELEASE_BASE_URL"
          ./scripts/verify-manifest.py \
            dist/runtime-manifest.json \
            --assets-dir dist

      - name: Sign manifest
        run: |
          test -n "$SIGNING_KEY_B64" || {
            echo "Missing PIPEROS_MANIFEST_SIGNING_KEY_B64 repository secret" >&2
            exit 1
          }
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/manifest-private.pem"
          openssl pkeyutl \
            -sign \
            -rawin \
            -inkey "$RUNNER_TEMP/manifest-private.pem" \
            -in dist/runtime-manifest.json \
            -out dist/runtime-manifest.sig
          openssl pkeyutl \
            -verify \
            -rawin \
            -pubin \
            -inkey keys/manifest-public.pem \
            -in dist/runtime-manifest.json \
            -sigfile dist/runtime-manifest.sig
          rm -f "$RUNNER_TEMP/manifest-private.pem"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "PiperOS Termux ${{ github.ref_name }}" \
            --notes "GPLv3 PiperOS runtime for arm64-v8a, armeabi-v7a and x86_64." \
            dist/*
